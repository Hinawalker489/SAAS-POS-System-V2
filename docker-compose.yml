version: '3.8'

services:
  saas-pos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saas-pos
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./data/dev.db
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-your-secret-key-change-this-in-production-min-32-chars-12345678901234567890}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:4000}
    volumes:
      # Persist database
      - ./data:/app/data
      # Persist Prisma migrations
      - ./prisma:/app/prisma
    restart: unless-stopped

